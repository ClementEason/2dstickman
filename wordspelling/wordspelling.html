<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 单词默写大挑战 Pro 🌟</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #00b894;
            --danger-color: #ff7675;
            --bg-color: #f0f3f8;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dfe6e9 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2d3436;
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.15);
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 10;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 0px rgba(108, 92, 231, 0.1);
        }

        .view { display: none; animation: fadeIn 0.5s ease; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 表单样式 */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #636e72; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
            background: white;
        }
        input:focus, select:focus { border-color: var(--primary-color); }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary-color), #a29bfe);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: linear-gradient(45deg, var(--secondary-color), #55efc4); margin-top: 10px;}
        .btn-danger { background: linear-gradient(45deg, var(--danger-color), #fab1a0); margin-top: 10px;}
        .btn-outline { background: white; border: 2px solid var(--primary-color); color: var(--primary-color); margin-top: 10px;}

        /* 默写区域 */
        .quiz-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quiz-num { 
            background: var(--primary-color); 
            color: white; 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .quiz-cn { flex: 1; font-size: 1.1rem; }
        
        /* 提示与输入框样式 */
        .input-group { display: flex; align-items: center; gap: 5px; }
        .hint-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            transition: transform 0.2s; padding: 5px;
        }
        .hint-btn:hover { transform: scale(1.2); }
        .hint-text {
            font-size: 0.8rem; color: #e17055; background: #ffeaa7;
            padding: 2px 6px; border-radius: 4px; display: none; flex: 1;
        }
        .hint-text.show { 
            display: inline-flex; /* 修改为 inline-flex，使其不独占一行 */
            align-items: center; /* 让文字垂直居中 */
            flex: none; /* 新增：取消弹性布局的伸缩属性，防止宽度被压缩 */
        }
        .quiz-input { 
            width: 160px; 
            text-align: center; 
            font-weight: bold; 
            letter-spacing: 1px; 
        }

        /* 结果页 */
        .score-board {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .score-num { font-size: 3rem; color: #d35400; line-height: 1; }
        .score-label { font-size: 1rem; color: #e17055; }

        .result-list { max-height: 200px; overflow-y: auto; margin-bottom: 15px; }
        .result-item { 
            padding: 8px; 
            border-bottom: 1px dashed #dfe6e9; 
            display: flex; 
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .wrong { color: var(--danger-color); font-weight: bold; }
        .correct { color: var(--secondary-color); }

        /* 排行榜 & 错题本 */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            background: #dfe6e9; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary-color); color: white; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: #636e72; }
        .rank-1 { color: #f1c40f; font-weight: bold; }
        .rank-2 { color: #bdc3c7; font-weight: bold; }
        .rank-3 { color: #e67e22; font-weight: bold; }

        .mistake-word, .mastered-word { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 20px; 
            margin: 4px; 
            font-size: 0.85rem; 
        }
        .mistake-word { background: #ffeaa7; }
        .mastered-word { background: #55efc4; color: #006266; }

        /* 装饰性背景星星 */
        .bg-star {
            position: fixed;
            font-size: 20px;
            opacity: 0.1;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* 提交时的星星特效 */
        .celebration-star {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
            animation: star-fly 1s ease-out forwards;
        }
        @keyframes star-fly {
            0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .quiz-input { width: 120px; font-size: 0.9rem; }
            h1 { font-size: 1.5rem; }
            .container { padding: 20px; }
        }
    </style>
</head>

    <!-- 背景装饰 -->

    <div class="bg-star" style="bottom: 30%; right: 5%; animation-delay: 0.5s;">⭐</div>

    <div class="container">

        <div id="view-start" class="view active">
            <h1>📝 单词默写大挑战 Pro</h1>
            <div class="form-group">
                <label>👋 你的名字是？</label>
                <input type="text" id="playerName" placeholder="输入昵称开始冒险..." maxlength="10">
            </div>
            <div class="form-group">
                <label>📚 选择单词库</label>
                <select id="unitSelect">
                    <option value="unit1">Unit 1: Growing Up & Technology</option>
                    <option value="unit2">Unit 2: Dealing with Fears & Emotions</option>
                    <option value="unit3">Unit 3: Careers & Services/option>
                    <option value="unit4">Unit 4: Smart Homes & Daily Life</option>
                    <option value="unit5">Unit 5: Films & Entertainment</option>
                    <option value="unit6">Unit 6: Places & Environment</option>
                    <option value="mistakes">📕 错题本 (专属复习)</option>
                    <option value="all">全部单元 (综合复习)</option>
                </select>
            </div>
            <div class="form-group">
                <label>🎯 挑战几个单词？(1-20)</label>
                <input type="number" id="wordCount" value="10" min="1" max="20">
            </div>
            <button class="btn" onclick="startQuiz()">🚀 开始挑战</button>
            <button class="btn btn-secondary" onclick="showView('view-stats')">🏆 排行榜 / 个人中心</button>
        </div>

        <!-- 2. 默写界面 -->
        <div id="view-quiz" class="view">
            <h1>✍️ 正在默写...</h1>
            <p style="text-align:center; color:#aaa; font-size:0.8rem; margin-bottom:10px;">💡 提示：按 Enter 键可自动跳到下一题；卡壳时点击灯泡看音标！</p>
            <div id="quizContainer" style="margin-bottom: 20px;"></div>
            <button class="btn" onclick="submitQuiz()">✅ 提交答案</button>
        </div>

        <!-- 3. 结果界面 -->
        <div id="view-result" class="view">
            <h1>🎉 挑战完成！</h1>
            <div class="score-board">
                <div class="score-num" id="finalScore">0</div>
                <div class="score-label">最终得分</div>
            </div>
            <div id="resultDetails" class="result-list"></div>
            <button class="btn" onclick="showView('view-start')">🏠 返回首页</button>
            <button class="btn btn-secondary" onclick="showView('view-stats')">📊 查看进度/排行</button>
        </div>

        <!-- 4. 统计界面 -->
        <div id="view-stats" class="view">
            <h1>📊 个人中心</h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('leaderboard', this)">🏆 排行榜</button>
                <button class="tab-btn" onclick="switchTab('mistakes', this)">📕 错题本</button>
                <button class="tab-btn" onclick="switchTab('mastered', this)">✅ 已掌握</button>
            </div>
            
            <div id="tab-leaderboard" class="tab-content">
                <table>
                    <thead><tr><th>排名</th><th>勇士</th><th>得分</th><th>日期</th></tr></thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>

            <div id="tab-mistakes" class="tab-content" style="display:none;">
                <div id="mistakesList" style="margin-bottom: 15px; min-height: 50px;"></div>
                <button class="btn btn-danger" onclick="clearMistakes()">🗑️ 清空错题本</button>
            </div>

            <div id="tab-mastered" class="tab-content" style="display:none;">
                <div id="masteredList" style="margin-bottom: 15px; min-height: 50px;"></div>
                <button class="btn btn-danger" onclick="clearMastered()">🔄 重置已掌握单词</button>
            </div>

            <button class="btn btn-secondary" style="margin-top:20px;" onclick="showView('view-start')">🔙 返回</button>
        </div>
    </div>

    // 2. 状态管理 (用户隔离)
    let state = {
        playerName: '',
        currentQuiz: [], 
        mistakes: [], 
        mastered: [], 
        leaderboard: []
    };

    // 获取当前用户的存储键名
    function getUserKey(key) {
        // 如果是排行榜，则使用固定的全局键名，不区分用户
        if (key === 'leaderboard') {
            return `wordApp_GLOBAL_leaderboard`;
        }
        return `wordApp_${state.playerName}_${key}`;
    }

    // 从本地存储加载用户数据
    function loadUserData() {
        state.mistakes = JSON.parse(localStorage.getItem(getUserKey('mistakes')) || '[]');
        state.mastered = JSON.parse(localStorage.getItem(getUserKey('mastered')) || '[]');
    }

    // 保存用户数据
    function saveUserData() {
        localStorage.setItem(getUserKey('mistakes'), JSON.stringify(state.mistakes));
        localStorage.setItem(getUserKey('mastered'), JSON.stringify(state.mastered));
    }

    // 3. 核心逻辑
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if (viewId === 'view-stats') renderStats();
    }

    function startQuiz() {
        const name = document.getElementById('playerName').value.trim();
        const unit = document.getElementById('unitSelect').value;
        const count = parseInt(document.getElementById('wordCount').value);
        
        if (!name) return alert('请输入你的名字哦！👋');
        if (isNaN(count) || count < 1 || count > 20) return alert('题目数量请在 1-20 之间！🎯');

        state.playerName = name;
        loadUserData(); // 加载当前用户的数据

        // 1. 确定词库范围
        let pool = [];
        // 新增逻辑：如果选择了错题本
        if (unit === 'mistakes') {
            // 从当前用户的错题本中加载单词，并转换成和词库一样的格式 {cn: ..., en: ..., ph: ...}
            // 注意：错题本里可能没有音标，这里给音标字段一个默认空字符串
            // 检查是否输入了名字（虽然前面的逻辑已经检查过，但这里再确认一次更保险）
        if (!name) {
            return alert('请先输入你的名字，才能加载你的专属错题本哦！👋');
        }
        
        // 检查当前用户的错题本是否为空
        // 注意：loadUserData() 已经在前面被调用，所以 state.mistakes 已经是最新数据
        if (state.mistakes.length === 0) {
            return alert('🎉 你的错题本还是空的！\n\n先去挑战一下，积累一些错题再来复习吧！🚀');
        }
            pool = state.mistakes.map(item => ({
                cn: item.cn,
                en: item.en,
                ph: item.ph || ''  // 如果没有音标，默认空字符串 
            }));
        } else {
            if (unit === 'all') {
                Object.values(WORD_BANK).forEach(arr => pool.push(...arr));
            } else {
                pool = [...WORD_BANK[unit]];
            }
        }

        // 2. 过滤掉已掌握的单词
        const unmasteredPool = pool.filter(w => !state.mastered.includes(w.en));

        // 3. 检查是否还有未掌握的单词
        if (unmasteredPool.length === 0) {
            alert('🎉 太棒了！这个单元的所有单词你都已经掌握了！\n\n你可以尝试选择"全部单元"或重置已掌握单词。');
            return;
        }

        // 4. 随机抽取题目（如果剩余单词少于设定数量，则全部抽取）
        const actualCount = Math.min(count, unmasteredPool.length);
        const shuffled = unmasteredPool.sort(() => Math.random() - 0.5);
        state.currentQuiz = shuffled.slice(0, actualCount).map(w => ({...w, userAnswer: ''}));

        // 如果实际抽取数量少于用户设定，给予提示
        if (actualCount < count) {
            alert(`💡 提示：该单元剩余未掌握单词只有 ${actualCount} 个，将全部加入本次挑战！`);
        }

        renderQuiz();
        showView('view-quiz');
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        // 修改点：移除了 onclick，增加了 data-phonetic="${item.ph}"
        container.innerHTML = state.currentQuiz.map((item, idx) => `
            <div class="quiz-item">
            <div class="quiz-num">${idx + 1}</div>
            <div class="quiz-cn">${item.cn}</div>
            <div class="input-group">
                <!-- 使用 data-phonetic 属性存储音标 -->
                <button class="hint-btn" data-phonetic="${item.ph}" title="点击查看音标">💡</button>
                <span class="hint-text">${item.ph}</span>
                <input class="quiz-input" type="text" data -idx="${idx}" placeholder="英文..." autocomplete="off" spellcheck="false" oninput="hideHint(this)">
            </div>
            </div>
        `).join('');

        // 绑定回车事件
        const inputs = container.querySelectorAll('.quiz-input');
        inputs.forEach((inp, idx) => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (idx < inputs.length - 1) {
                        inputs[idx + 1].focus();
                    } else {
                        submitQuiz();
                    }
                }
            });
        });

        // --- 新增代码：为音标按钮添加事件监听器 ---
        const hintBtns = container.querySelectorAll('.hint-btn');
        hintBtns.forEach(btn => {
            btn.addEventListener('click', function() {
            toggleHint(this);
            });
        });
        // --- 新增代码结束 ---
        
        // 自动聚焦第一题
        if(inputs.length > 0) inputs[0].focus();
    }

    // 修改点：函数不再接收 phonetic 参数
    window.toggleHint = function(btn) {
        const hintText = btn.nextElementSibling;
        // 使用 classList.toggle 来切换 .show 类
        hintText.classList.toggle('show');
        // 找到当前题目的外层容器，并添加一个类名，表示这道题用过了提示
        btn.closest('.quiz-item').classList.add('hint-used');
    };

    // 输入时自动隐藏音标提示
    window.hideHint = function(input) {
        const hintText = input.previousElementSibling;
        // 使用 classList.remove 来移除 .show 类
        hintText.classList.remove('show');
    }

    // 4. 星星特效
    function createStars(isPerfect) {
        const colors = isPerfect ? ['#f1c40f', '#f39c12', '#e67e22'] : ['#bdc3c7', '#95a5a6'];
        const emojis = isPerfect ? ['⭐', '🌟', '✨', '💫'] : ['✨'];
        const count = isPerfect ? 30 : 10;

        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'celebration-star';
            star.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            const x = window.innerWidth / 2;
            const y = window.innerHeight / 2;
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            
            const angle = Math.random() * 360;
            const distance = 100 + Math.random() * 200;
            const tx = Math.cos(angle * Math.PI / 180) * distance;
            const ty = Math.sin(angle * Math.PI / 180) * distance;
            
            star.style.setProperty('--tx', `${tx}px`);
            star.style.setProperty('--ty', `${ty}px`);
            star.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function submitQuiz() {
        const inputs = document.querySelectorAll('.quiz-input');
        let score = 0;

        inputs.forEach((inp, idx) => {
            const userAns = inp.value.trim().toLowerCase();
            const correctAns = state.currentQuiz[idx].en.toLowerCase();
            state.currentQuiz[idx].userAnswer = userAns;

            if (userAns === correctAns) {
                score++;
                // ✅ 答对加入已掌握列表（去重）
                // 1. 找到当前题目对应的 DOM 元素
                const currentQuizItem = inp.closest('.quiz-item');
                
                // 2. 只有当答案正确，并且没有使用过提示（即没有 'hint-used' 类名）时，才加入已掌握列表
                if (!currentQuizItem.classList.contains('hint-used')) {
                    const wordEn = state.currentQuiz[idx].en;
                    if (!state.mastered.includes(wordEn)) {
                    state.mastered.push(wordEn);
                    }
                }
            } else {
                // ❌ 答错加入错题本（去重）
                const wordEn = state.currentQuiz[idx].en;
                const exists = state.mistakes.some(m => m.en.toLowerCase() === wordEn.toLowerCase());
                if (!exists) {
                    state.mistakes.push({
                        cn: state.currentQuiz[idx].cn, 
                        en: state.currentQuiz[idx].en,
                        ph: state.currentQuiz[idx].ph
                    });
                }
            }
        });

        // 1. 获取现有的全局排行榜
        let globalLeaderboard = JSON.parse(localStorage.getItem('wordApp_GLOBAL_leaderboard') || '[]');

        // 2. 将本次成绩添加到全局排行榜
        globalLeaderboard.push({
            name: state.playerName,
            score: score,
            total: state.currentQuiz.length,
            date: new Date().toLocaleDateString()
        });

        // 3. 保存更新后的全局排行榜
        localStorage.setItem('wordApp_GLOBAL_leaderboard', JSON.stringify(globalLeaderboard));

        // 保存当前用户数据
        saveUserData();

        // 星星特效
        const isPerfect = score === state.currentQuiz.length;
        createStars(isPerfect);

        // 显示结果
        document.getElementById('finalScore').textContent = `${score} / ${state.currentQuiz.length}`;
        renderResultDetails();
        showView('view-result');
    }

    function renderResultDetails() {
        const container = document.getElementById('resultDetails');
        container.innerHTML = state.currentQuiz.map(item => {
            const isCorrect = item.userAnswer.toLowerCase() === item.en.toLowerCase();
            return `
                <div class="result-item">
                    <span>${item.cn}</span>
                    <span class="${isCorrect ? 'correct' : 'wrong'}">
                        ${isCorrect ? '✅ ' + item.en : '❌ ' + (item.userAnswer || '未作答') + ' → ' + item.en}
                    </span>
                </div>
            `;
        }).join('');
    }

    // 5. 统计与个人中心
    function renderStats() {
        // 1. 读取全局排行榜数据
        const globalLeaderboard = JSON.parse(localStorage.getItem('wordApp_GLOBAL_leaderboard') || '[]');

        // 排行榜
        const lbBody = document.getElementById('leaderboardBody');
        if (globalLeaderboard.length === 0) { // 使用 globalLeaderboard
            lbBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#aaa; padding:20px;">暂无记录，快去挑战吧！🚀</td></tr>';
        } else {
            const sorted = [...globalLeaderboard].sort((a, b) => b.score - a.score || a.total - b.total); // 使用 globalLeaderboard
            lbBody.innerHTML = sorted.map((item, idx) => `
                <tr>
                    <td class="${idx < 3 ? 'rank-' + (idx+1) : ''}">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}</td>
                    <td>${item.name}</td>
                    <td>${item.score}/${item.total}</td>
                    <td style="font-size:0.8rem; color:#aaa;">${item.date}</td>
                </tr>
            `).join('');
        }

        // 错题本
        const mistakesList = document.getElementById('mistakesList');
        if (state.mistakes.length === 0) {
            mistakesList.innerHTML = '<p style="text-align:center; color:#aaa; padding:20px;">🎉 太棒了！错题本是空的！</p>';
        } else {
            mistakesList.innerHTML = state.mistakes.map(m => 
                `<span class="mistake-word" title="${m.cn}">${m.en}</span>`
            ).join('');
        }

        // 已掌握单词
        const masteredList = document.getElementById('masteredList');
        if (state.mastered.length === 0) {
            masteredList.innerHTML = '<p style="text-align:center; color:#aaa; padding:20px;">📝 还没有掌握的单词，快去挑战吧！</p>';
        } else {
            masteredList.innerHTML = state.mastered.map(en => {
                // 从词库中查找对应的中文
                let cn = '';
                for (const unit of Object.values(WORD_BANK)) {
                    const found = unit.find(w => w.en === en);
                    if (found) { cn = found.cn; break; }
                }
                return `<span class="mastered-word" title="${cn}">${en}</span>`;
            }).join('');
        }
    }

    function switchTab(tabName, btnEl) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        
        btnEl.classList.add('active');
        document.getElementById(`tab-${tabName}`).style.display = 'block';
    }

    function clearMistakes() {
        if(confirm('确定要清空当前用户的错题本吗？🗑️')) {
            state.mistakes = [];
            saveUserData();
            renderStats();
        }
    }

    function clearMastered() {
        if(confirm('确定要重置当前用户的已掌握单词吗？\n重置后这些单词会重新出现在默写中。🔄')) {
            state.mastered = [];
            saveUserData();
            renderStats();
        }
    }

    // 初始化：记住上次输入的名字
    document.getElementById('playerName').value = localStorage.getItem('wordApp_lastPlayerName') || '';

    const playerNameInput = document.getElementById('playerName');
    playerNameInput.value = localStorage.getItem('wordApp_lastPlayerName') || '';

    // 新增：根据自动填入的用户名加载数据
    if (playerNameInput.value) {
    state.playerName = playerNameInput.value;
    loadUserData();
    }
    
    document.getElementById('playerName').addEventListener('input', function() {
        localStorage.setItem('wordApp_lastPlayerName', this.value);
        // 2. 更新当前状态中的用户名
        state.playerName = this.value;
        
        // 3. 关键步骤：根据新的用户名，立即加载该用户的数据
        if (this.value) {
            loadUserData();
        }
    });

</script>
</body>
</html>
